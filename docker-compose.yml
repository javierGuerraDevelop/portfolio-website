version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_GITHUB_USERNAME=${GITHUB_USERNAME}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - portfolio-network
    restart: unless-stopped
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    environment:
      - PORT=8080
      - GITHUB_USERNAME=${GITHUB_USERNAME}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - ALLOWED_ORIGINS=https://guerrajavierswe.com,https://www.guerrajavierswe.com
    networks:
      - portfolio-network
    restart: unless-stopped
networks:
  portfolio-network:
    driver: bridge
