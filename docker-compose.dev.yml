version: '3.8'

services:
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev
        ports:
            - '${FRONTEND_PORT:-3000}:5173'
        volumes:
            - ./frontend/src:/app/src
            - ./frontend/public:/app/public
        environment:
            - VITE_API_URL=http://localhost:${BACKEND_PORT:-8080}
            - VITE_GITHUB_USERNAME=${GITHUB_USERNAME}
        depends_on:
            - backend
        networks:
            - portfolio-network

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile.dev
        ports:
            - '${BACKEND_PORT:-8080}:8080'
        volumes:
            - ./backend:/app
        environment:
            - PORT=8080
            - GITHUB_USERNAME=${GITHUB_USERNAME}
            - GITHUB_TOKEN=${GITHUB_TOKEN:-}
            - ALLOWED_ORIGINS=http://localhost:${FRONTEND_PORT:-3000}
        networks:
            - portfolio-network

networks:
    portfolio-network:
        driver: bridge
